<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        
        <div class="sub-main-1">
            <h2>Welcome to my Tick Tack Toe Game</h2>
            <div class="button">
                <button id="game"> Start Game</button>
            </div>
             <div class="player">
                <p class="playerOne"></p>
            <div class="winner">
                <p class="winning"></p>
            </div>
            <p class="playerTwo"></p>
            </div>
            <div id="board-container"></div>
        </div>

        <div class="sub-main-2">
            <img src="justice-league.JPG" alt="Justice League" class="image">
        </div>
        
    </div>
        
    <script src="script.js"></script>
</body>
</html>
